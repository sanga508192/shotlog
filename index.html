<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ParUp TH</title>
  <meta name="description" content="จดกอล์ฟรายช็อตและสกอร์ก๊วน เพื่อดูรูปแบบข้อผิดพลาดและวางแผนฝึกซ้อม">
  <meta name="theme-color" content="#13693f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="net" class="net" hidden>ออฟไลน์ — จดต่อได้ ข้อมูลบันทึกในเครื่อง</div>
  <div id="update" class="update-bar" hidden><span>มี ParUp TH รุ่นใหม่</span><button type="button" id="update-btn">อัปเดตเลย</button></div>
  <main id="app"><div class="page"><p class="muted">กำลังเปิด…</p></div></main>
  <nav class="tabbar" id="tabbar" aria-label="เมนูหลัก">
    <a href="#/" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
      หน้าแรก</a>
    <a href="#/coach" data-tab="summary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>
      พัฒนา</a>
    <a href="#/courses" data-tab="play" class="fab" aria-label="จดรอบ">
      <span class="fab-dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 21V3l10 4-10 4"/><path d="M4 21h8"/></svg></span>

      ซ้อม</a>
    <a href="#/settings" data-tab="me">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      ฉัน</a>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="js/app.js"></script>
